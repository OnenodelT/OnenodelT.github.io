<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Onenode | Accueil</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            overflow: hidden; /* Empêche le scroll, force la concentration */
        }

        /* Arrière-plan dynamique et psychologique */
        .ambient-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            animation: pulse 8s infinite alternate ease-in-out;
        }
        
        .light-blue {
            top: -10%; left: -10%;
            width: 40vw; height: 40vw;
            background: linear-gradient(135deg, #2563eb, transparent);
        }

        .light-emerald {
            bottom: -10%; right: -10%;
            width: 40vw; height: 40vw;
            background: linear-gradient(135deg, #10b981, transparent);
            animation-delay: -4s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
            100% { transform: scale(1.2) translate(5%, 5%); opacity: 0.5; }
        }

        /* Animation d'entrée douce pour réduire la brutalité de l'affichage */
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative">

    <!-- Éclairage ambiant (Design Premium) -->
    <div class="ambient-light light-blue"></div>
    <div class="ambient-light light-emerald"></div>

    <div class="w-full max-w-sm z-10 flex flex-col items-center">
        <!-- En-tête / Logo -->
        <div class="text-center mb-10 fade-in-up" style="animation-delay: 0.1s;">
            <div class="relative inline-flex items-center justify-center w-24 h-24 mb-6 group">
                <!-- Effet de halo derrière le logo -->
                <div class="absolute inset-0 bg-blue-500 rounded-[2rem] blur-xl opacity-50 group-hover:opacity-70 transition-opacity duration-500"></div>
                <div class="relative flex items-center justify-center w-full h-full bg-gradient-to-br from-blue-500 to-blue-700 rounded-[2rem] shadow-2xl transform group-hover:scale-105 transition-transform duration-300">
                    <i data-lucide="shopping-cart" class="w-12 h-12 text-white"></i>
                </div>
            </div>
            <h1 class="text-5xl font-extrabold tracking-tight mb-3 text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">
                Onenode
            </h1>
            <p class="text-slate-400 text-lg font-medium">L'écosystème commercial unifié.</p>
        </div>

        <!-- Zone de segmentation (Hick's Law) -->
        <div class="w-full space-y-5 fade-in-up" style="animation-delay: 0.3s;">
            
            <!-- BOUTON ACHETEUR (Friction zéro, appel à la consommation) -->
            <a href="acheteur.html" class="group relative w-full flex items-center justify-between p-6 bg-white text-slate-900 rounded-3xl font-bold text-xl hover:bg-slate-50 transition-all duration-300 shadow-[0_8px_30px_rgb(0,0,0,0.12)] hover:shadow-[0_8px_40px_rgba(37,99,235,0.2)] active:scale-[0.98] overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="relative flex items-center gap-4 z-10">
                    <div class="p-3 bg-blue-100 rounded-2xl group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                        <i data-lucide="shopping-bag" class="w-6 h-6 text-blue-600 group-hover:text-white transition-colors"></i>
                    </div>
                    Je veux acheter
                </div>
                <i data-lucide="arrow-right" class="w-6 h-6 text-slate-400 group-hover:text-blue-600 group-hover:translate-x-1 transition-all z-10"></i>
            </a>

            <!-- BOUTON VENDEUR (Contraste cognitif, appel au profit) -->
            <a href="vendeur.html" class="group relative w-full flex items-center justify-between p-6 bg-slate-800/80 backdrop-blur-md text-white border border-slate-700/50 rounded-3xl font-bold text-xl hover:bg-slate-800 transition-all duration-300 shadow-xl hover:border-emerald-500/50 hover:shadow-[0_8px_40px_rgba(16,185,129,0.15)] active:scale-[0.98]">
                <div class="relative flex items-center gap-4 z-10">
                    <div class="p-3 bg-slate-700/50 rounded-2xl group-hover:bg-emerald-500/20 transition-colors duration-300">
                        <i data-lucide="store" class="w-6 h-6 text-emerald-400"></i>
                    </div>
                    Je veux vendre
                </div>
                <i data-lucide="arrow-right" class="w-6 h-6 text-slate-500 group-hover:text-emerald-400 group-hover:translate-x-1 transition-all z-10"></i>
            </a>
        </div>

        <!-- Réassurance subtile (Social Proof basique) -->
        <div class="mt-12 text-center fade-in-up" style="animation-delay: 0.5s;">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest flex items-center justify-center gap-2">
                <i data-lucide="shield-check" class="w-4 h-4 text-slate-400"></i>
                Plateforme sécurisée
            </p>
        </div>
    </div>

    <script>
        // Initialisation des icônes
        lucide.createIcons();
    </script>
</body>
</html>
